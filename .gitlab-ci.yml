stages:
  - test

offline-validation:
  stage: test
  image: nikolaik/python-nodejs:python3.12-nodejs22
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONHASHSEED: "0"
    PYTHON: "python3"
  script:
    - node packages/runsteward-core/scripts/run-all-tests.mjs
    - node --test tests/runsteward-atomic-family.test.mjs
