<svg xmlns="http://www.w3.org/2000/svg" width="820" height="416" viewBox="0 0 820 416" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14.5">
  <rect x="6" y="6" width="808" height="404" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="6" y="6" width="808" height="38" rx="10" fill="#161b22"/>
  <rect x="6" y="34" width="808" height="10" fill="#161b22"/>
  <circle cx="30" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="25" r="6" fill="#27c93f"/>
  <text x="410" y="30" text-anchor="middle" fill="#8b949e" font-size="13">Claude Carry — the overnight loop</text>

  <text x="26" y="78" xml:space="preserve"><tspan fill="#6e7681">$ </tspan><tspan fill="#e6edf3">carry add </tspan><tspan fill="#a5d6ff">"refactor the auth module into smaller files"</tspan><tspan fill="#e6edf3"> --goal </tspan><tspan fill="#a5d6ff">"npm test passes"</tspan></text>
  <text x="26" y="102" xml:space="preserve"><tspan fill="#3fb950">✔ </tspan><tspan fill="#8b949e">queued t1  ·  sonnet  ·  branch carry/t1</tspan></text>

  <text x="26" y="142" xml:space="preserve"><tspan fill="#6e7681">$ </tspan><tspan fill="#e6edf3">carry run --until-idle</tspan></text>
  <text x="26" y="166" xml:space="preserve"><tspan fill="#79c0ff">▶ </tspan><tspan fill="#8b949e">t1 running  ·  session 3f9c…  ·  carry/t1</tspan></text>
  <text x="26" y="190" xml:space="preserve"><tspan fill="#d29922">⏸ </tspan><tspan fill="#8b949e">usage limit reached — sleeping; OS wake armed for </tspan><tspan fill="#e6edf3">23:00</tspan></text>
  <text x="26" y="214" xml:space="preserve"><tspan fill="#d29922">⏰ </tspan><tspan fill="#8b949e">23:00 reset — woke and resumed the </tspan><tspan fill="#e6edf3">same session</tspan><tspan fill="#8b949e"> automatically</tspan></text>
  <text x="26" y="238" xml:space="preserve"><tspan fill="#3fb950">✔ </tspan><tspan fill="#8b949e">t1 done  ·  $1.84  ·  work landed on carry/t1</tspan></text>

  <text x="26" y="278" xml:space="preserve"><tspan fill="#6e7681">$ </tspan><tspan fill="#e6edf3">carry handoff</tspan></text>
  <text x="26" y="302" xml:space="preserve"><tspan fill="#e6edf3" font-weight="bold">1 done</tspan><tspan fill="#8b949e"> · 0 need you · 0 failed · 0 waiting</tspan></text>
  <text x="26" y="326" xml:space="preserve"><tspan fill="#8b949e">t1  refactor the auth module   →   carry/t1   </tspan><tspan fill="#3fb950">✓ npm test passes</tspan></text>

  <text x="26" y="372" xml:space="preserve"><tspan fill="#6e7681">Queue a task, walk away. It rides through the usage-limit reset and PC sleep,</tspan></text>
  <text x="26" y="392" xml:space="preserve"><tspan fill="#6e7681">then you pick up finished work in the morning — on its own branch, in VS Code.</tspan></text>
</svg>
